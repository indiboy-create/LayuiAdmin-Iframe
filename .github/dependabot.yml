version: 2

updates:
    # npm 依赖：构建与质量工具链
    - package-ecosystem: npm
      directory: '/'
      schedule:
          interval: weekly
          day: monday
          time: '09:00'
          timezone: Asia/Shanghai
      open-pull-requests-limit: 5
      commit-message:
          prefix: chore
          include: scope
      groups:
          # 小版本与补丁合并到一个 PR，减少噪音；大版本仍需人工评估
          dev-dependencies:
              dependency-type: development
              update-types:
                  - minor
                  - patch
      ignore:
          - dependency-name: '*'
            update-types:
                - version-update:semver-major

    # GitHub Actions：checkout / setup-node / upload-artifact 等
    - package-ecosystem: github-actions
      directory: '/'
      schedule:
          interval: weekly
          day: monday
          time: '09:00'
          timezone: Asia/Shanghai
      open-pull-requests-limit: 3
      commit-message:
          prefix: chore
          include: scope
      groups:
          actions:
              patterns:
                  - '*'
