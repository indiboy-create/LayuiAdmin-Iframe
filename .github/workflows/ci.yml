name: CI

on:
    workflow_call:
        inputs:
            upload-artifact:
                description: 是否上传 dist 产物
                type: boolean
                default: true
            build-debug:
                description: 是否额外构建未压缩产物 dist-debug
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    quality:
        name: Lint, test, build and verify (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: [20, 22, 24]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Audit dependencies
              if: ${{ matrix.node-version == 24 }}
              run: npm audit --audit-level=high

            - name: Lint
              run: npm run lint

            - name: Format check
              if: ${{ matrix.node-version == 24 }}
              run: npm run format:check

            - name: Test
              run: npm run test

            - name: Build
              run: npm run build

            - name: Verify site
              run: npm run check:release

            - name: Verify package contents
              if: ${{ matrix.node-version == 24 }}
              run: npm run check:package

            - name: E2E smoke
              if: ${{ matrix.node-version == 24 }}
              run: npm run e2e

            - name: Build debug
              if: ${{ inputs.build-debug && matrix.node-version == 24 }}
              run: npm run build:debug

            - name: Verify debug site
              if: ${{ inputs.build-debug && matrix.node-version == 24 }}
              run: npm run check:debug

            - name: Upload dist-debug
              if: ${{ inputs.build-debug && matrix.node-version == 24 }}
              uses: actions/upload-artifact@v4
              with:
                  name: dist-debug
                  path: dist-debug
                  retention-days: 1
                  if-no-files-found: error

            - name: Upload dist
              if: ${{ inputs.upload-artifact && matrix.node-version == 24 }}
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist
                  retention-days: 1
                  if-no-files-found: error
