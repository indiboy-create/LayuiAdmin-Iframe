name: Release Package

on:
  release:
    types: [created]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

  publish-gpr:
    name: Publish to GitHub Packages
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com/
          scope: '@indiboy-create'

      - run: npm ci

      - name: Build dist
        run: npm run build

      - name: Package dist
        run: zip -r "layuiadmin-iframe-${GITHUB_REF_NAME}.zip" dist

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: layuiadmin-iframe-dist
          path: layuiadmin-iframe-*.zip
          if-no-files-found: error

      - name: Publish package to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dist to Release
        run: gh release upload "${GITHUB_REF_NAME}" layuiadmin-iframe-*.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}