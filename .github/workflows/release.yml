name: Release Package

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write
    packages: write

jobs:
    quality:
        name: Lint, build and verify
        uses: ./.github/workflows/ci.yml

    release:
        name: Publish dist
        needs: quality
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  registry-url: https://npm.pkg.github.com/
                  scope: '@indiboy-create'

            - name: Download dist
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist

            - name: Package dist
              run: |
                  cd dist
                  zip -r "../layuiadmin-iframe-${GITHUB_REF_NAME}.zip" .

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: layuiadmin-iframe-dist
                  path: layuiadmin-iframe-*.zip
                  if-no-files-found: error

            - name: Publish to GitHub Packages
              run: npm publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
                    echo "Release ${GITHUB_REF_NAME} already exists"
                  else
                    gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
                  fi
                  gh release upload "${GITHUB_REF_NAME}" "layuiadmin-iframe-${GITHUB_REF_NAME}.zip" --clobber
