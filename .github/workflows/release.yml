name: Release Package

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: read
jobs:
    quality:
        name: Lint, build and verify
        uses: ./.github/workflows/ci.yml
        with:
            build-debug: true

    release:
        name: Publish dist
        needs: quality
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
            id-token: write
        env:
            # 用于判断公共 npm 源是否配置了发布令牌
            NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  registry-url: https://npm.pkg.github.com/
                  scope: '@initearth'

            - name: Verify tag matches package version
              run: |
                  VERSION="$(node -p "require('./package.json').version")"
                  if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
                    echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}" >&2
                    exit 1
                  fi

            - name: Download dist
              uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist

            - name: Download dist-debug
              uses: actions/download-artifact@v8
              with:
                  name: dist-debug
                  path: dist-debug

            - name: Package dist
              run: |
                  cd dist
                  zip -r "../mytsa-admin-iframe-${GITHUB_REF_NAME}.zip" .
                  cd ../dist-debug
                  zip -r "../mytsa-admin-iframe-${GITHUB_REF_NAME}-debug.zip" .

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: mytsa-admin-iframe-dist
                  path: mytsa-admin-iframe-*.zip
                  if-no-files-found: error

            # GitHub Packages 要求包 scope 与仓库 owner 一致；
            # 仓库归属 initearth 时才发布，否则跳过（只发 npm 公共源）
            - name: Publish to GitHub Packages
              if: github.repository_owner == 'initearth'
              run: |
                  echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
                  npm publish --ignore-scripts --registry=https://npm.pkg.github.com/
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # 未配置 NPM_TOKEN 时跳过公共源发布
            - name: Publish to npm registry
              if: env.NPM_TOKEN != ''
              run: |
                  echo "@initearth:registry=https://registry.npmjs.org/" >> .npmrc
                  echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
                  npm publish --ignore-scripts --registry=https://registry.npmjs.org/ --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
                    echo "Release ${GITHUB_REF_NAME} already exists"
                  else
                    gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
                  fi
                  gh release upload "${GITHUB_REF_NAME}" "mytsa-admin-iframe-${GITHUB_REF_NAME}.zip" "mytsa-admin-iframe-${GITHUB_REF_NAME}-debug.zip" --clobber
