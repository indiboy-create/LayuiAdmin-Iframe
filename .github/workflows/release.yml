name: Release Package

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write
    packages: write
jobs:
    quality:
        name: Lint, build and verify
        uses: ./.github/workflows/ci.yml
        with:
            build-debug: true

    release:
        name: Publish dist
        needs: quality
        runs-on: ubuntu-latest
        env:
            # 用于判断公共 npm 源是否配置了发布令牌
            NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  registry-url: https://npm.pkg.github.com/
                  scope: '@indiboy-create'

            - name: Download dist
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist

            - name: Download dist-debug
              uses: actions/download-artifact@v4
              with:
                  name: dist-debug
                  path: dist-debug

            - name: Package dist
              run: |
                  cd dist
                  zip -r "../layuiadmin-iframe-${GITHUB_REF_NAME}.zip" .
                  cd ../dist-debug
                  zip -r "../layuiadmin-iframe-${GITHUB_REF_NAME}-debug.zip" .

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: layuiadmin-iframe-dist
                  path: layuiadmin-iframe-*.zip
                  if-no-files-found: error

            # 直接用质量任务产出的 dist 发布，--ignore-scripts 跳过 prepublishOnly 的二次构建，
            # 避免 npm 包与 zip 来自两次不同构建（构建戳不一致）
            - name: Publish to GitHub Packages
              run: |
                  echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
                  npm publish --ignore-scripts --registry=https://npm.pkg.github.com/
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # 未配置 NPM_TOKEN 时跳过公共源发布，只保留 GitHub Packages
            - name: Publish to npm registry
              if: env.NPM_TOKEN != ''
              run: |
                  echo "@indiboy-create:registry=https://registry.npmjs.org/" >> .npmrc
                  echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
                  npm publish --ignore-scripts --registry=https://registry.npmjs.org/ --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
                    echo "Release ${GITHUB_REF_NAME} already exists"
                  else
                    gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
                  fi
                  gh release upload "${GITHUB_REF_NAME}" "layuiadmin-iframe-${GITHUB_REF_NAME}.zip" "layuiadmin-iframe-${GITHUB_REF_NAME}-debug.zip" --clobber
