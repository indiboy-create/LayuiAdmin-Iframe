<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="robots" content="noindex,nofollow" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#20222A" />
		<meta name="color-scheme" content="light" />
		<meta name="referrer" content="no-referrer" />
		<title>页面不存在 - MyTSA</title>
		<link rel="icon" href="favicon.ico" />
		<style>
			:root {
				color-scheme: light;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #f5f6f7;
				color: #20222a;
				font:
					14px/1.7 -apple-system,
					'Segoe UI',
					'Microsoft YaHei',
					sans-serif;
			}
			main {
				max-width: 520px;
				padding: 40px 28px;
				text-align: center;
				background: #fff;
				border-radius: 8px;
				box-shadow: 0 6px 24px rgba(32, 34, 42, 0.08);
			}
			.code {
				margin: 0 0 8px;
				font-size: 64px;
				font-weight: 600;
				letter-spacing: 2px;
				color: #20222a;
			}
			h1 {
				margin: 0 0 12px;
				font-size: 18px;
				font-weight: 500;
			}
			p {
				margin: 0 0 20px;
				color: #6f727d;
			}
			.back {
				display: inline-block;
				padding: 8px 20px;
				border: 1px solid #20222a;
				border-radius: 4px;
				color: #20222a;
				text-decoration: none;
			}
			.back:focus-visible {
				outline: 2px solid #20222a;
				outline-offset: 2px;
			}
		</style>
	</head>
	<body>
		<main>
			<p class="code" aria-hidden="true">404</p>
			<h1>页面不存在</h1>
			<p>地址可能已失效，或者你没有权限访问这个页面。</p>
			<a class="back" href="index.html">返回后台首页</a>
		</main>
	</body>
</html>
