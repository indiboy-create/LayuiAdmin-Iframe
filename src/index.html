<!doctype html>
<html lang="zh-CN">
	<head>
		<title>LayuiAdmin-Iframe</title>
		<meta charset="utf-8" />
		<meta name="renderer" content="webkit" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="基于 layui 的 iframe 版后台管理模板" />
		<link rel="icon" href="favicon.ico" />
		<link rel="stylesheet" href="component/pear/css/pear.css" />
		<link rel="stylesheet" href="admin/css/admin.css" />
		<link rel="stylesheet" href="admin/css/variables.css" />
		<link rel="stylesheet" href="admin/css/reset.css" />
	</head>
	<!-- 结 构 代 码 -->

	<body class="layui-layout-body pear-admin">
		<!-- 布 局 框 架 -->
		<div class="layui-layout layui-layout-admin">
			<!-- 顶 部 样 式 -->
			<div class="layui-header">
				<!-- 菜 单 顶 部 -->
				<div class="layui-logo">
					<!-- 图 标 -->
					<img class="logo" />
					<!-- 标 题 -->
					<span class="title"></span>
				</div>
				<!-- 顶 部 左 侧 功 能 -->
				<ul class="layui-nav layui-layout-left">
					<li class="collapse layui-nav-item" lay-unselect>
						<a
							href="javascript:;"
							class="layui-icon layui-icon-shrink-right"
							title="侧边伸缩"
							aria-label="侧边伸缩"
						></a>
					</li>
					<li class="refresh layui-nav-item layui-hide-xs" lay-unselect>
						<a
							href="javascript:;"
							class="layui-icon layui-icon-refresh-1"
							loading="600"
							title="刷新"
							aria-label="刷新"
						></a>
					</li>
				</ul>

				<!-- 顶 部 右 侧 菜 单 -->
				<ul class="layui-nav layui-layout-right">
					<!-- 消 息 入 口 -->
					<li class="layui-nav-item" lay-unselect>
						<a
							href="javascript:;"
							user-menu-id="10"
							user-menu-title="首页"
							user-menu-url="layui.html"
							title="消息中心"
							aria-label="消息中心"
						>
							<i class="layui-icon layui-icon-notice"></i>
							<span class="layui-badge-dot"></span>
						</a>
					</li>

					<li class="layui-nav-item user" lay-unselect>
						<!-- 头 像 -->
						<a href="javascript:;">
							<i class="layui-icon layui-icon-username"></i>
							<cite class="layui-hide-xs">管理员</cite>
						</a>
						<!-- 功 能 菜 单 -->
						<dl class="layui-nav-child">
							<dd>
								<a
									user-menu-url="layui.html"
									user-menu-id="10"
									user-menu-title="首页"
									>消息中心</a
								>
							</dd>
							<hr />
							<dd style="text-align: center">
								<a href="javascript:void(0);" class="logout">注销登录</a>
							</dd>
						</dl>
					</li>
					<!-- 主 题 配 置 -->
					<li class="layui-nav-item setting" lay-unselect>
						<a
							href="javascript:;"
							class="layui-icon layui-icon-theme"
							title="主题设置"
							aria-label="主题设置"
						></a>
					</li>
				</ul>
			</div>
			<!-- 侧 边 区 域 -->
			<div class="layui-side layui-bg-black">
				<!-- 菜 单 顶 部 -->
				<div
					class="layui-logo"
					user-menu-id="10"
					user-menu-title="首页"
					user-menu-url="layui.html"
					title="返回首页"
					style="cursor: pointer"
				>
					<!-- 图 标 -->
					<img class="logo" />
					<!-- 标 题 -->
					<span class="title"></span>
				</div>
				<!-- 菜 单 内 容 -->
				<div class="layui-side-scroll">
					<div id="side"></div>
				</div>
			</div>
			<!-- 视 图 页 面 -->
			<div class="layui-body">
				<!-- 内 容 页 面 -->
				<div id="content"></div>
			</div>

			<!-- 遮 盖 层 -->
			<div class="pear-cover"></div>
			<!-- 加 载 动 画 -->
			<div class="loader-wrapper">
				<!-- 动 画 对 象 -->
				<div class="loader"></div>
			</div>
		</div>
		<!-- 移 动 端 便 捷 操 作 -->
		<div class="pear-collapsed-pe collapse">
			<a href="#" class="layui-icon layui-icon-shrink-right"></a>
		</div>
		<!-- 依 赖 脚 本 -->
		<script src="admin/js/debug.js"></script>
		<script src="component/layui/layui.js"></script>
		<script src="component/pear/pear.js"></script>
		<!-- 框 架 初 始 化 -->
		<script>
			layui.use(['admin', 'jquery'], function () {
				var admin = layui.admin;
				var $ = layui.jquery;

				// json | api
				admin.setConfigurationPath('admin/config/pear.config.json');

				// 渲染
				admin.render();

				// 注销
				admin.logout(function () {
					// 清空 tabs 缓存
					return new Promise((resolve) => {
						resolve(true);
					});
				});
			});
		</script>
	</body>
</html>
