<!doctype html>
<html lang="zh-CN">
	<head>
		<title>LayuiAdmin-Iframe</title>
		<meta charset="utf-8" />
		<meta name="renderer" content="webkit" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="基于 layui 的 iframe 版后台管理模板" />
		<link rel="icon" href="favicon.ico" />
		<link rel="stylesheet" href="component/layui/css/layui.css" />
		<link rel="stylesheet" href="component/pear/css/pear.css" />
		<link rel="stylesheet" href="component/pear/css/module/menu.css" />
		<link rel="stylesheet" href="component/pear/css/module/tabPage.css" />
		<link rel="stylesheet" href="admin/css/admin.css" />
		<link rel="stylesheet" href="admin/css/variables.css" />
		<link rel="stylesheet" href="admin/css/reset.css" />
		<script src="admin/js/auth.js"></script>
		<script>
			Auth.guard();
		</script>
	</head>
	<!-- 结 构 代 码 -->

	<body class="layui-layout-body pear-admin">
		<a class="pear-skip-link" href="#content">跳到主内容</a>
		<!-- 布 局 框 架 -->
		<div class="layui-layout layui-layout-admin">
			<!-- 顶 部 样 式 -->
			<div class="layui-header">
				<!-- 菜 单 顶 部 -->
				<div class="layui-logo">
					<!-- 图 标 -->
					<img class="logo" alt="LayuiAdmin-Iframe" />
					<!-- 标 题 -->
					<span class="title"></span>
				</div>
				<!-- 顶 部 左 侧 功 能 -->
				<ul class="layui-nav layui-layout-left">
					<li class="collapse layui-nav-item" lay-unselect>
						<a
							href="javascript:;"
							class="layui-icon layui-icon-shrink-right"
							title="侧边伸缩"
							aria-label="侧边伸缩"
						></a>
					</li>
					<li class="refresh layui-nav-item layui-hide-xs" lay-unselect>
						<a
							href="javascript:;"
							class="layui-icon layui-icon-refresh-1"
							loading="600"
							title="刷新"
							aria-label="刷新"
						></a>
					</li>
				</ul>

				<!-- 顶 部 右 侧 菜 单 -->
				<ul class="layui-nav layui-layout-right">
					<!-- 消 息 入 口 -->
					<li class="layui-nav-item" lay-unselect>
						<a
							href="javascript:;"
							user-menu-id="10"
							user-menu-title="首页"
							user-menu-url="layui.html"
							title="消息中心"
							aria-label="消息中心"
						>
							<i class="layui-icon layui-icon-notice"></i>
							<span class="layui-badge-dot"></span>
						</a>
					</li>

					<li class="layui-nav-item user" lay-unselect>
						<!-- 头 像 -->
						<a href="javascript:;">
							<i class="layui-icon layui-icon-username"></i>
							<cite class="layui-hide-xs">管理员</cite>
						</a>
						<!-- 功 能 菜 单 -->
						<dl class="layui-nav-child">
							<dd>
								<a
									user-menu-url="layui.html"
									user-menu-id="10"
									user-menu-title="首页"
									>消息中心</a
								>
							</dd>
							<dd>
								<a href="javascript:;" class="setting">系统主题</a>
							</dd>
							<hr />
							<dd style="text-align: center">
								<a href="javascript:void(0);" class="logout">注销登录</a>
							</dd>
						</dl>
					</li>
					<li class="layui-nav-item" lay-unselect>
						<a
							href="javascript:;"
							class="about-us layui-icon layui-icon-about"
							title="关于我们"
							aria-label="关于我们"
						></a>
					</li>
				</ul>
			</div>
			<!-- 侧 边 区 域 -->
			<div class="layui-side layui-bg-black">
				<!-- 菜 单 顶 部 -->
				<div
					class="layui-logo"
					user-menu-id="10"
					user-menu-title="首页"
					user-menu-url="layui.html"
					title="返回首页"
					style="cursor: pointer"
				>
					<!-- 图 标 -->
					<img class="logo" alt="LayuiAdmin-Iframe" />
					<!-- 标 题 -->
					<span class="title"></span>
				</div>
				<!-- 菜 单 内 容 -->
				<div class="layui-side-scroll">
					<div id="side"></div>
				</div>
			</div>
			<!-- 视 图 页 面 -->
			<div class="layui-body">
				<!-- 内 容 页 面 -->
				<div id="content" tabindex="-1"></div>
			</div>

			<!-- 遮 盖 层 -->
			<div class="pear-cover"></div>
			<!-- 加 载 动 画 -->
			<div class="loader-wrapper">
				<!-- 动 画 对 象 -->
				<div class="loader"></div>
			</div>
		</div>
		<!-- 移 动 端 便 捷 操 作 -->
		<div class="pear-collapsed-pe collapse">
			<a
				href="javascript:;"
				class="layui-icon layui-icon-shrink-right"
				aria-label="收起侧边栏"
			></a>
		</div>
		<!-- 依 赖 脚 本 -->
		<script src="admin/js/debug.js"></script>
		<script src="component/layui/layui.js"></script>
		<script src="component/pear/pear.js"></script>
		<script src="admin/js/about.js"></script>
		<script>
			layui.use(['admin'], function () {
				'use strict';

				var admin = layui.admin;
				var current = Auth.session();

				if (current) {
					var nameEl = document.querySelector(
						'.layui-header .layui-nav-right .user cite'
					);
					if (nameEl) {
						nameEl.textContent = current.name;
					}
				}

				admin.setConfigurationPath('admin/config/pear.config.json');

				admin.render();

				admin.logout(function () {
					return new Promise((resolve) => {
						Auth.logout();
						resolve(true);
					});
				});
			});
			// 跳过导航链接：聚焦时显形（:focus 在窗口失焦场景不一定匹配，补一个类兜底）
			(function () {
				var skipLink = document.querySelector('.pear-skip-link');
				if (!skipLink) {
					return;
				}
				skipLink.addEventListener('focus', function () {
					skipLink.classList.add('is-focused');
				});
				skipLink.addEventListener('blur', function () {
					skipLink.classList.remove('is-focused');
				});
			})();
		</script>
	</body>
</html>
