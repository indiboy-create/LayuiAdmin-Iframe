<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>消息中心</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="component/layui/css/layui.css" rel="stylesheet" media="all">
  <link href="component/layui/css/extend.css" rel="stylesheet" media="all">
</head>

<body class="iframe-container">
  <div class="watermark" id="">
    <div class="layui-card">
      <div class="layui-tab layui-tab-brief">
        <ul class="layui-tab-title">
          <li class="layui-this">全部消息</li>
          <li>通知<span class="layui-badge">6</span></li>
          <li>私信</li>
        </ul>
        <div class="layui-tab-content">

          <div class="layui-tab-item layui-show">
            <div class="LAY-app-message-btns" style="margin-bottom: 10px;">
              <button class="layui-btn layui-btn-primary layui-btn-sm" data-type="all" data-events="del">删除</button>
              <button class="layui-btn layui-btn-primary layui-btn-sm" data-type="all" data-events="ready">标记已读</button>
              <button class="layui-btn layui-btn-primary layui-btn-sm" data-type="all"
                data-events="readyAll">全部已读</button>
            </div>

            <table id="LAY-app-message-all" lay-filter="LAY-app-message-all"></table>
          </div>
          <div class="layui-tab-item">

            <div class="LAY-app-message-btns" style="margin-bottom: 10px;">
              <button class="layui-btn layui-btn-primary layui-btn-sm" data-type="notice" data-events="del">删除</button>
              <button class="layui-btn layui-btn-primary layui-btn-sm" data-type="notice"
                data-events="ready">标记已读</button>
              <button class="layui-btn layui-btn-primary layui-btn-sm" data-type="notice"
                data-events="readyAll">全部已读</button>
            </div>

            <table id="LAY-app-message-notice" lay-filter="LAY-app-message-notice"></table>
          </div>
          <div class="layui-tab-item">

            <div class="LAY-app-message-btns" style="margin-bottom: 10px;">
              <button class="layui-btn layui-btn-primary layui-btn-sm" data-type="direct" data-events="del">删除</button>
              <button class="layui-btn layui-btn-primary layui-btn-sm" data-type="direct"
                data-events="ready">标记已读</button>
              <button class="layui-btn layui-btn-primary layui-btn-sm" data-type="direct"
                data-events="readyAll">全部已读</button>
            </div>

            <table id="LAY-app-message-direct" lay-filter="LAY-app-message-direct"></table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="component/layui/layui.js"></script>
  <script src="admin/plugin/watermark/gwm.js"></script>
  <script>
    layui.use(["layer"], function () {
      layer = layui.layer;
      gwm.creation({
        txt: "13888888888",
        width: 128,
        height: 100,
        x: 20,
        y: 70,
        fontSize: 13,
        color: "#cccccc",
        alpha: 0.2,
        destroy: false,
        container: ".watermark",
      });
    });
  </script>
</body>

</html>
