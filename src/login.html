<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="robots" content="noindex,nofollow" />
		<meta name="color-scheme" content="light" />
		<meta name="referrer" content="no-referrer" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
		<title>登录</title>
		<link rel="stylesheet" href="component/layui/css/layui.css" />
		<link rel="stylesheet" href="theme/login/css/login.css" />
	</head>

	<body>
		<div class="login-page" style="background-image: url(theme/login/images/background.svg)">
			<div class="layui-row">
				<div class="layui-col-sm6 login-bg layui-hide-xs">
					<img
						class="login-bg-img"
						src="theme/login/images/banner.webp"
						alt="登录页插图"
					/>
				</div>
				<div class="layui-col-sm6 layui-col-xs12 login-form">
					<form class="layui-form">
						<div class="form-center">
							<div class="form-center-box">
								<div class="top-log-title">
									<img
										class="top-log"
										src="theme/login/images/logo.webp"
										alt="MyTSA"
										width="50"
										height="50"
										decoding="async"
									/>
									<span>MyTSA</span>
								</div>
								<div class="top-desc">
									以 超 乎 想 象 的 速 度 构 建 内 部 工 具
								</div>
								<div style="margin-top: 30px">
									<div class="layui-form-item">
										<div class="layui-input-wrap">
											<div class="layui-input-prefix">
												<i class="layui-icon layui-icon-username"></i>
											</div>
											<input
												name="username"
												lay-verify="required"
												placeholder="账户"
												autocomplete="username"
												class="layui-input"
											/>
										</div>
									</div>
									<div class="layui-form-item">
										<div class="layui-input-wrap">
											<div class="layui-input-prefix">
												<i class="layui-icon layui-icon-password"></i>
											</div>
											<input
												type="password"
												name="password"
												value=""
												lay-verify="required"
												placeholder="密码"
												autocomplete="current-password"
												class="layui-input"
												lay-affix="eye"
											/>
										</div>
									</div>
									<div class="tab-log-verification">
										<div class="verification-text">
											<div class="layui-input-wrap">
												<div class="layui-input-prefix">
													<i class="layui-icon layui-icon-auz"></i>
												</div>
												<!-- 演示占位：验证码不参与校验，不强制填写 -->
												<input
													placeholder="验证码"
													autocomplete="off"
													class="layui-input"
												/>
											</div>
										</div>
										<img
											src="theme/login/images/captcha.gif"
											alt="验证码"
											class="verification-img"
										/>
									</div>
									<div class="layui-form-item">
										<div class="remember-passsword">
											<div class="remember-cehcked">
												<input
													type="checkbox"
													name="like1[write]"
													lay-skin="primary"
													title="自动登录"
												/>
											</div>
										</div>
									</div>
									<div class="login-alert" id="login-alert"></div>
									<div class="login-btn">
										<button
											type="button"
											lay-submit
											lay-filter="login"
											class="layui-btn login"
										>
											登 录
										</button>
									</div>
									<div class="other-login">
										<div class="other-login-methods">其他方式</div>
										<div class="greenText">注册账号</div>
									</div>
								</div>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
		<!-- 资 源 引 入 -->
		<script src="component/layui/layui.js"></script>
		<script src="component/request/request.js"></script>
		<script>
			layui.use(['form', 'http'], function () {
				var form = layui.form;
				var http = layui.http;

				form.on('submit(login)', function (data) {
					http.post('/api/login', data.field, { withAuth: false })
						.then(function () {
							window.location.href = 'panel.html';
						})
						.catch(function (error) {
							document.getElementById('login-alert').textContent =
								error.message || '登录失败';
						});
					return false;
				});
			});
		</script>
	</body>
</html>
