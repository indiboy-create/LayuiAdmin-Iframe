<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
		<title>登录</title>
		<link rel="stylesheet" href="component/layui/css/layui.css" />
		<link rel="stylesheet" href="component/pear/css/pear.css" />
		<link rel="stylesheet" href="admin/css/login.css" />
		<link rel="stylesheet" href="admin/css/variables.css" />
		<script src="admin/js/login-guard.js"></script>
		<script src="admin/js/auth.js"></script>
		<script>
			Auth.guardLoginPage();
		</script>
	</head>

	<body>
		<div class="login-page" style="background-image: url(admin/images/background.svg)">
			<div class="layui-row">
				<div class="layui-col-sm6 login-bg layui-hide-xs">
					<img class="login-bg-img" src="admin/images/banner.webp" alt="登录页插图" />
				</div>
				<div class="layui-col-sm6 layui-col-xs12 login-form">
					<form class="layui-form" onsubmit="return false;">
						<div class="form-center">
							<div class="form-center-box">
								<div class="top-log-title">
									<img
										class="top-log"
										src="admin/images/logo.png"
										alt="LayuiAdmin-Iframe"
									/>
									<span>LayuiAdmin-Iframe</span>
								</div>
								<div class="top-desc">
									以 超 乎 想 象 的 速 度 构 建 内 部 工 具
								</div>
								<div style="margin-top: 30px">
									<div class="layui-form-item">
										<div class="layui-input-wrap">
											<div class="layui-input-prefix">
												<i class="layui-icon layui-icon-username"></i>
											</div>
											<input
												name="username"
												lay-verify="required"
												placeholder="账户"
												autocomplete="username"
												class="layui-input"
												aria-label="账户"
												aria-required="true"
											/>
										</div>
									</div>
									<div class="layui-form-item">
										<div class="layui-input-wrap">
											<div class="layui-input-prefix">
												<i class="layui-icon layui-icon-password"></i>
											</div>
											<input
												type="password"
												name="password"
												value=""
												lay-verify="required"
												placeholder="密码"
												autocomplete="current-password"
												class="layui-input"
												lay-affix="eye"
												aria-label="密码"
												aria-required="true"
											/>
										</div>
									</div>
									<div class="tab-log-verification">
										<div class="verification-text">
											<div class="layui-input-wrap">
												<div class="layui-input-prefix">
													<i class="layui-icon layui-icon-auz"></i>
												</div>
												<!-- 演示占位：验证码不参与校验，不强制填写 -->
												<input
													placeholder="验证码"
													aria-label="验证码"
													autocomplete="off"
													class="layui-input"
												/>
											</div>
										</div>
										<img
											src="admin/images/captcha.gif"
											alt="验证码"
											class="verification-img"
										/>
									</div>
									<div class="layui-form-item">
										<div class="remember-passsword">
											<div class="remember-cehcked">
												<input
													type="checkbox"
													name="like1[write]"
													lay-skin="primary"
													title="自动登录"
												/>
											</div>
										</div>
									</div>
									<div
										class="login-alert"
										id="login-alert"
										role="alert"
										aria-live="assertive"
									></div>
									<div class="login-btn">
										<button
											type="button"
											lay-submit
											lay-filter="login"
											class="layui-btn login"
										>
											登 录
										</button>
									</div>
									<div class="other-login">
										<div class="other-login-methods">其他方式</div>
										<div class="greenText">注册账号</div>
									</div>
								</div>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
		<!-- 资 源 引 入 -->
		<script src="admin/js/debug.js"></script>
		<script src="component/layui/layui.js"></script>
		<script src="component/pear/pear.js"></script>
		<script>
			layui.use(['form', 'layer'], function () {
				'use strict';

				var form = layui.form;
				var layer = layui.layer;

				form.on('submit(login)', function (data) {
					var field = data.field || {};
					var button = data.elem;

					if (button) {
						button.disabled = true;
					}

					Auth.login(field.username, field.password, !!field['like1[write]'])
						.then(function () {
							window.location.href = 'index.html';
						})
						.catch(function (error) {
							if (button) {
								button.disabled = false;
							}

							var message = error && error.message ? error.message : '登录失败';
							var alert = document.getElementById('login-alert');
							if (alert) {
								alert.textContent = message;
							}

							var username = document.querySelector('input[name="username"]');
							var password = document.querySelector('input[name="password"]');
							if (username) {
								username.setAttribute('aria-invalid', 'true');
							}
							if (password) {
								password.setAttribute('aria-invalid', 'true');
							}

							layer.msg(message, {
								icon: 2,
								time: 2000,
							});
						});

					return false;
				});
			});
		</script>
	</body>
</html>
