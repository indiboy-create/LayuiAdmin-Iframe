<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="robots" content="noindex,nofollow" />
		<meta name="theme-color" content="#20222A" />
		<meta name="color-scheme" content="light" />
		<meta name="referrer" content="no-referrer" />
		<title>首页</title>
		<meta name="renderer" content="webkit" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link href="../component/layui/css/layui.css" rel="stylesheet" media="all" />
		<link href="../theme/iframe/css/iframe.css" rel="stylesheet" media="all" />
		<link href="../component/layui/css/extend.css" rel="stylesheet" media="all" />
	</head>

	<body class="iframe-container">
		<div class="layui-card watermark">
			<div class="layui-card-header">数据概览</div>
			<div class="layui-card-body">
				<div class="layui-row layui-col-space15">
					<div class="layui-col-md3 layui-col-xs6">
						<div class="layui-card">
							<div class="layui-card-body">
								<div class="layui-font-12 layui-font-gray">今日访问</div>
								<div class="layui-font-24 layui-font-blue">12,846</div>
							</div>
						</div>
					</div>
					<div class="layui-col-md3 layui-col-xs6">
						<div class="layui-card">
							<div class="layui-card-body">
								<div class="layui-font-12 layui-font-gray">订单总数</div>
								<div class="layui-font-24 layui-font-green">1,024</div>
							</div>
						</div>
					</div>
					<div class="layui-col-md3 layui-col-xs6">
						<div class="layui-card">
							<div class="layui-card-body">
								<div class="layui-font-12 layui-font-gray">待办任务</div>
								<div class="layui-font-24 layui-font-orange">36</div>
							</div>
						</div>
					</div>
					<div class="layui-col-md3 layui-col-xs6">
						<div class="layui-card">
							<div class="layui-card-body">
								<div class="layui-font-12 layui-font-gray">系统消息</div>
								<div class="layui-font-24 layui-font-red">8</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<div class="layui-card watermark">
			<div class="layui-card-header">模板说明</div>
			<div class="layui-card-body">
				<p>本页为 iframe 模式下的首页示例，可直接替换为业务首页。</p>
				<p>
					左侧菜单与标签页由后台入口配置；本页水印文字通过
					<code>layui.use</code> 回调配置。
				</p>
			</div>
		</div>
		<div class="layui-card watermark">
			<table class="layui-hide" id="ID-table-demo-setRowChecked"></table>
		</div>
		<script type="text/html" id="demo-toolbar-setRowChecked">
			<div class="layui-btn-container">
				<button class="layui-btn layui-btn-sm" lay-event="getCheckData">
					获取选中行数据
				</button>
			</div>
		</script>
		<script src="../component/layui/layui.js"></script>
		<script src="../component/iframe/iframe.js"></script>
		<script>
			layui.use(['table', 'watermark'], function () {
				var table = layui.table;

				// 渲染
				table.render({
					elem: '#ID-table-demo-setRowChecked',
					url: '/api/user.json', // 此处为静态模拟数据，实际使用时需换成真实接口
					page: true,
					cols: [
						[
							// {type: 'radio', fixed: 'left'},
							{ field: 'id', title: 'ID', width: 80, fixed: 'left', unresize: true },
							{ field: 'username', title: '用户', width: 120 },
							{ field: 'sex', title: '性别', width: 80 },
							{ field: 'city', title: '城市', width: 100 },
							{ field: 'sign', title: '签名' },
							{ field: 'experience', title: '积分', width: 80, sort: true },
						],
					],
					toolbar: '#demo-toolbar-setRowChecked',
					initSort: {
						// 设置初始排序
						field: 'experience', // 字段名
						type: 'desc', // 倒序
					},
					height: 366,
				});

				// 行单击事件( 双击事件为: rowDouble )
				table.on('row(ID-table-demo-setRowChecked)', function (obj) {
					var data = obj.data; // 获取当前行数据

					// 显示 - 仅用于演示
					layer.msg('当前行数据：<br>' + JSON.stringify(data), {
						offset: '65px',
					});
					// 标注当前点击行的选中状态
					obj.setRowChecked({
						type: 'radio', // radio 单选模式；checkbox 复选模式
					});
				});
				// 头工具栏事件
				table.on('toolbar(ID-table-demo-setRowChecked)', function (obj) {
					var checkStatus = table.checkStatus(obj.config.id); //获取选中行状态
					switch (obj.event) {
						case 'getCheckData':
							var data = checkStatus.data; // 获取选中行数据
							layer.alert(JSON.stringify(data)); // 显示 - 仅用于演示
							break;
					}
				});
			});
		</script>
	</body>
</html>
