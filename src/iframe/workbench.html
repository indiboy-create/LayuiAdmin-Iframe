<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="robots" content="noindex,nofollow" />
		<meta name="theme-color" content="#20222A" />
		<meta name="color-scheme" content="light" />
		<meta name="referrer" content="no-referrer" />
		<title>工作台</title>
		<meta name="renderer" content="webkit" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link href="../component/layui/css/layui.css" rel="stylesheet" media="all" />
		<link href="../theme/iframe/css/iframe.css" rel="stylesheet" media="all" />
		<link href="../component/layui/css/extend.css" rel="stylesheet" media="all" />
	</head>

	<body class="iframe-container">
		<div class="layui-card">
			<div class="layui-card-header">待办事项</div>
			<div class="layui-card-body">
				<table class="layui-table" lay-skin="line">
					<thead>
						<tr>
							<th style="width: 90px">状态</th>
							<th>事项</th>
							<th style="width: 140px">负责人</th>
							<th style="width: 120px">截止时间</th>
						</tr>
					</thead>
					<tbody>
						<tr>
							<td><span class="layui-badge layui-bg-red">待处理</span></td>
							<td>整理本周迭代需求清单</td>
							<td>张三</td>
							<td>今天</td>
						</tr>
						<tr>
							<td><span class="layui-badge layui-bg-orange">进行中</span></td>
							<td>补充首页统计接口</td>
							<td>李四</td>
							<td>明天</td>
						</tr>
						<tr>
							<td><span class="layui-badge layui-bg-green">已完成</span></td>
							<td>修复标签页关闭后会话丢失</td>
							<td>王五</td>
							<td>昨天</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

		<div class="layui-card">
			<div class="layui-card-header">快捷入口</div>
			<div class="layui-card-body">
				<div class="layui-row layui-col-space15">
					<div class="layui-col-md4">
						<a
							class="layui-btn layui-btn-fluid"
							href="javascript:;"
							data-tab-id="91"
							data-tab-url="table.html"
							data-tab-title="查询表格"
							>查询表格</a
						>
					</div>
					<div class="layui-col-md4">
						<a
							class="layui-btn layui-btn-fluid layui-btn-primary"
							href="javascript:;"
							data-tab-id="21"
							data-tab-url="layui.html"
							data-tab-title="消息中心"
							>消息中心</a
						>
					</div>
					<div class="layui-col-md4">
						<a
							class="layui-btn layui-btn-fluid layui-btn-normal"
							href="javascript:;"
							data-tab-id="10"
							data-tab-url="home.html"
							data-tab-title="首页"
							>数据概览</a
						>
					</div>
				</div>
			</div>
		</div>

		<script src="../component/layui/layui.js"></script>
		<script src="../component/iframe/iframe.js"></script>
		<script src="../theme/iframe/js/workbench.js"></script>
	</body>
</html>
